<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Songs — AirKords charts</title>
<meta name="description" content="Songs played in the air on AirKords. Listen, like, and climb the charts.">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<style>
.head{padding:clamp(32px,6vw,64px) 0 8px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:8px 0 18px}
.filters .seg{flex:0 1 420px}
.chipset{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--border);background:transparent;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--text-dim);min-height:40px}
.fchip[aria-pressed=true]{background:var(--surface-hover);color:var(--text);border-color:var(--border-strong)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.pod{padding:20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.pod::after{content:attr(data-rank);position:absolute;right:14px;top:4px;font-size:72px;font-weight:900;letter-spacing:-.05em;color:var(--brand);opacity:.13}
.pod__t{font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod__row{display:flex;gap:10px;align-items:center}
@media (max-width:820px){.podium{grid-template-columns:1fr}}
.more{display:flex;justify-content:center;margin-top:18px}
.cta{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 22px;margin-top:28px}
</style>
</head>
<body>
<div data-nav></div>
<main class="wrap" style="padding-bottom:72px">
  <div class="head">
    <div class="eyebrow eyebrow--brand">The charts</div>
    <h1 class="section-h" style="font-size:clamp(2.4rem,6vw,3.6rem)">Played in the air.</h1>
    <p class="section-sub">Every song here was strummed on AirKords. Tap play to listen — songs are played back live with real guitar strings.</p>
  </div>
  <div class="filters">
    <div class="seg" id="sort" role="group" aria-label="Sort">
      <button data-s="top" aria-pressed="true">Top</button><button data-s="new" aria-pressed="false">New</button><button data-s="plays" aria-pressed="false">Most played</button>
    </div>
    <div class="chipset" id="modes" role="group" aria-label="Type">
      <button class="fchip" data-m="" aria-pressed="true">All</button><button class="fchip" data-m="song" aria-pressed="false">AI songs</button><button class="fchip" data-m="enhanced" aria-pressed="false">Enhanced</button><button class="fchip" data-m="rough" aria-pressed="false">Rough</button>
    </div>
  </div>
  <div class="podium" id="podium"></div>
  <div class="rows" id="list"><div class="empty">Loading songs…</div></div>
  <div class="more"><button class="btn btn--line" id="more" style="display:none">Load more</button></div>
  <div class="card cta"><div><b style="font-size:18px">Make your own.</b><div class="dim">Record a jam and it can be up here in a minute.</div></div><a class="btn btn--brand" href="/play#record">Start playing</a></div>
</main>
<div data-foot></div>
<script type="module" src="/js/ui/songs.js"></script>
</body>
</html>
